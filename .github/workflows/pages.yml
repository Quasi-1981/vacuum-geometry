# Build the site from docs/ and publish it to GitHub Pages.
#
# The Markdown under docs/ arrives already assembled and frozen: it is exported
# from the working repository by a manifest-driven builder under the author's
# signature. This workflow therefore only renders and deploys — it does not
# select, filter or generate content.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: pip install mkdocs-material

      # --strict: a broken internal link fails the build instead of shipping a
      # dead page. The node pages cross-reference each other heavily, so link
      # integrity is the property most worth guarding here.
      - name: Build site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
